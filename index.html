.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #777; margin-bottom: 14px; }
h1 { font-family: 'Sora', sans-serif; font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; margin: 0 auto 14px; max-width: 820px; }

.card { background: var(--surface); border: .5px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--c); }
.card-h { display: flex; align-items: center; gap: 12px; }
.icon-box { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; background: var(--c); flex-shrink: 0; }

.mat { font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }

en:{
  eyebrow:"Course · ProPatiens Institute · UMH Patient Chair",
  h1:"AI tools for <span>patient associations</span>",
  sub:"Four single-file web apps, using your own AI key, for your association's internal communication, external communication, funding proposals and surveys.",
  stApps:"apps", stSes:"sessions", stHours:"online", stLangs:"languages",
  navApps:"Apps", navCourse:"Course", navKey:"AI key", navRules:"Rules of use",
  appsH:"The four apps",
  appsLead:"Each app runs in the browser, with no installation or server, using OpenAI, Google Gemini or Anthropic Claude. The AI proposes and the code checks.",
  checks:"What the code checks", open:"Open app", session:"Session",
  shared:"All four apps share the association profile (name, mission, audiences, tone and approved sources) in a single JSON file, so you only fill it in once.",
  apps:{
    juntia:{ area:"Internal communication", what:"Board and general meeting notices with agenda; minutes from notes or audio with decisions, owners and deadlines; decision tracking; announcements to members and volunteers; volunteer welcome handbook.", chk:"Every decision in the minutes carries a verbatim quote from the notes; decisions without a quote are flagged; dates and deadlines are computed by code." },
    difundia:{ area:"External communication", what:"Communication plan and calendar; one message adapted to social media, press release, website, newsletter and WhatsApp; plain-language versions per audience; Canva design brief.", chk:"Readability computed by code (Fernández-Huerta index); health claims cited to an approved source; external links, new figures and stigmatising wording flagged." },
    subvencia:{ area:"Funding proposals", what:"Upload the call and the project outline; extracts the evaluation rubric; scores the project and improves it in cycles until it nears the maximum.", chk:"Every criterion carries its quote from the call; the total score is summed by code using the call's weights; a change is kept only if the score rises; nothing invented ([COMPLETAR] markers)." },
    encuestia:{ area:"Survey analysis", what:"Upload an Excel or CSV file; describes each question; compares before and after; groups open answers into themes; generates a Word report with charts.", chk:"Every figure is computed by code; each theme carries verbatim answers; groups of fewer than 5 people are hidden to prevent re-identification." }
  },
  courseH:"The course",
  courseLead:"Five 2-hour online sessions. Each association applies the apps to its own anonymised documents and leaves with four real deliverables.",
  thN:"", thSes:"Session", thOut:"Deliverable", thMat:"Materials",
  matSoon:"Coming soon",
  sessions:[
    { t:"Providers, models and your AI key", a:"Slides and key guide", o:"Key configured with a spending limit and the association profile saved as JSON." },
    { t:"Internal communication", a:"JuntIA", o:"Reviewed minutes, notice for the next meeting and one internal announcement." },
    { t:"External communication", a:"DifundIA", o:"Reviewed multichannel mini-campaign and a three-month communication calendar." },
    { t:"Funding proposals", a:"SubvencIA", o:"Call rubric, improved project in Word and a cycle report with each version's score." },
    { t:"Survey analysis", a:"EncuestIA", o:"Word survey report and presentation of the four deliverables to the group." }
  ],
  keyH:"Your AI key",
  keyLead:"The apps call the provider's API with your own key. The key is stored only in your browser and never passes through a course server.",
  keyStepsH:"Create a key with a spending limit",
  keySteps:[
    "Create an account on the provider's developer platform (in the course, platform.openai.com).",
    "Add a payment method and set a low monthly spending limit before creating the key.",
    "Create an API key, copy it and keep it somewhere safe: it is not shown again.",
    "Paste it into the app, load the list of models available to your key and pick an inexpensive one.",
    "If the key is exposed, revoke it on the platform and create a new one."
  ],
  keyChooseH:"How to choose a model",
  keyChoose:[
    "Capability: large models reason better; small ones are enough for drafting and summarising.",
    "Cost: you pay per token (price per million); drafting minutes costs cents.",
    "Context window: how much text fits in one request; 1,000 tokens are roughly 5 or 6 pages.",
    "Privacy: API use is not used for training by default, but health data is a special category under the GDPR and must not be sent in identifiable form."
  ],
  rulesH:"Rules of use",
  rulesLead:"They apply in every session and every app.",
  privH:"Data protection",
  priv:[
    "Anonymised documents only: never clinical records, member lists or identifiable health data.",
    "Anonymise before sending. The apps mask emails, ID numbers, phone numbers and IBANs and warn about possible names.",
    "In surveys, groups of fewer than 5 people and cross-tabulations that could identify someone are not shown.",
    "Each participant uses their own key, stored only in their browser."
  ],
  ethH:"Responsible use",
  eth:[
    "Review everything the AI proposes before using or publishing it.",
    "Disclose AI use where appropriate.",
    "No app gives doses, regimens or individual clinical advice.",
    "The AI does not invent the association's data: anything missing is marked [COMPLETAR].",
    "SubvencIA's simulated score is a guide; it does not guarantee the real evaluator's score."
  ],
  footOrg:"Course “AI for patient associations” · ProPatiens Institute and Patient Chair of Miguel Hernández University of Elche",
  footDev:"Developed by", footLic:"MIT licence"
},

let lang = "es";

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = L[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = L[el.dataset.i18nHtml]; });
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("active", b.dataset.l === lang));

  document.getElementById("grid").innerHTML = APPS.map(a => {
    const A = L.apps[a.id];
    const url = `https://fborrasumh.github.io/${a.id}/`;
    const btn = `<a class="btn" href="${url}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> ${esc(L.open)}</a>`;
    return `<article class="card" style="--c:var(${a.c})">
      <div class="card-h"><div class="icon-box"><i class="ti ${a.icon}"></i></div>
        <div><h3>${a.name}</h3><div class="ses">${esc(L.session)} ${a.ses} · ${esc(A.area)}</div></div></div>
      <p>${esc(A.what)}</p>
      <div class="chk"><b>${esc(L.checks)}</b>${esc(A.chk)}</div>
      <div class="foot">${btn}</div>
    </article>`;
  }).join("");

  document.getElementById("sessions").innerHTML =
    `<div class="srow head"><div></div><div>${esc(L.thSes)}</div><div class="hide-sm">${esc(L.thOut)}</div><div class="hide-sm">${esc(L.thMat)}</div></div>` +
    L.sessions.map((s,i) => `<div class="srow" style="--c:var(${SES_COLOR[i+1]})">
      <div class="snum">${i+1}</div>
      <div><div class="stit">${esc(s.t)}</div><div class="sapp">${esc(s.a)}</div></div>
      <div class="hide-sm">${esc(s.o)}</div>
      <div class="hide-sm"><span class="mat"><i class="ti ti-folder"></i> ${esc(L.matSoon)}</span></div>
    </div>`).join("");

  const list = (id, arr) => { document.getElementById(id).innerHTML = arr.map(x => `<li>${esc(x)}</li>`).join(""); };
  list("keySteps", L.keySteps); list("keyChoose", L.keyChoose); list("priv", L.priv); list("eth", L.eth);
}

function setLang(l){
  lang = l;
  try { localStorage.setItem("propatiens-lang", l); } catch(e) {}
  render();
}

document.getElementById("langs").innerHTML = LANGS.map(l => `<button data-l="${l}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");
try {
  const saved = localStorage.getItem("propatiens-lang");
  lang = LANGS.includes(saved) ? saved : "es";
} catch(e) {}
render();
</script>
